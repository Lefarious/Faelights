<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Faelights mote"><title>Faelights mote</title><style>.halo{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{0%,100%{fill-opacity:0.35;transform:scale(1)}50%{fill-opacity:0.6;transform:scale(1.12)}}@media (prefers-reduced-motion:reduce){.halo{animation:none}}</style><circle class="halo" cx="16" cy="16" r="11.5" fill="#F4B23E" fill-opacity="0.35"/><circle cx="16" cy="16" r="6.5" fill="#F4B23E"/></svg>
